# Unit + Playwright on pull requests. Pushes to main use "Deploy to GitHub Pages"
# (tests run there before build/deploy) so the suite is not run twice per merge.
name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm test
