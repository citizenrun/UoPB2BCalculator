# Build and publish the free tier to Cloudflare Pages.
#
# Replaces deploy-pages.yml. Keeps the same release ritual: test, bump the patch
# version, prepend a CHANGELOG entry, refresh public/release.json, then build and
# deploy. The bump is committed back with [skip ci] so it does not re-trigger.
#
# Note the base path differs from the old GitHub Pages workflow: the site is now
# served from the apex of polandsalary.com, not from /<repo>/, so the default
# relative base in vite.config.js is correct and no --base override is needed.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — b404e2a3f07436d852ffd600267391a1
#
# The paid Worker in worker/ is deployed separately and deliberately: it is
# proprietary, it holds a licence-key namespace, and it should not redeploy on
# every push to the free tier.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !(github.event_name == 'push' && github.event.head_commit != null && contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run test:unit

      - run: node scripts/build-job-rules.mjs

      - name: Prepare release metadata
        env:
          DEPLOY_RELEASE: "1"
          RELEASE_SUMMARY: ${{ github.event.head_commit.message }}
        run: node scripts/release-meta.mjs

      - run: npx vite build

      # public/_headers is what turns the CSP and cache rules into real HTTP
      # headers on Pages. If Vite ever stops copying it, fail loudly rather than
      # shipping a site with no security headers.
      - name: Check _headers survived the build
        run: test -f dist/_headers || (echo "dist/_headers missing" && exit 1)

      # Deliberately not cloudflare/wrangler-action. wrangler is already pinned in
      # devDependencies, so `npm ci` installs the exact version used locally and
      # the deploy stops depending on a third-party action that would run with the
      # Cloudflare API token in scope. It also sidesteps that action's Node 20
      # runtime deprecation. wrangler reads both secrets from the environment.
      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=polandsalary --branch=main

      # Runs even if an earlier step failed, so a deploy never leaves the repo
      # claiming an older version than the site is serving.
      #
      # The push is retried: a transient GitHub 503 here previously published
      # v0.1.9 to the site while main stayed on v0.1.8. Rebase between attempts
      # in case another run landed first.
      - name: Commit version and changelog
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md public/release.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          VER=$(node -p "require('./package.json').version")
          git commit -m "chore(release): v${VER} [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push failed (attempt ${attempt}); rebasing and retrying"
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 5))
          done
          echo "::error::could not push the release commit after 5 attempts; main is behind the deployed site"
          exit 1
