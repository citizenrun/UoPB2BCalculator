# Unit + Playwright. Runs on pull requests and on every push to main (same as before).
# Pushes to main also run "Deploy to GitHub Pages", which tests again before build/deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm test
